[package]
name = "micro_pdf"
version = "1.6.0"
edition = "2024"
description = "Fast, ultra-lightweight, portable PDF viewer and power editor"
authors = ["azam-data"]
repository = "https://github.com/azam-data/MicroPDF"

[dependencies]
pdfium-render = "0.8"
anyhow = "1.0"
winit = "0.30"
softbuffer = "0.4"
rfd = "0.15"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
ttf-parser = "0.25"
flate2 = "1"
rust_xlsxwriter = "0.84"
pulldown-cmark = { version = "0.13", default-features = false }
docx-rs = "0.4"
roxmltree = "0.20"
hypher = { version = "0.1", default-features = false, features = ["alloc", "english", "french", "german", "spanish"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
